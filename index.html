<!doctype html>

	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>dua portfolio</title>

		<link rel="stylesheet" href="/src/styles/main.css" />

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<nav id="navbar">
			<a href="#" class="logo">DuaByte</a>
			<div class="links">
				<a href="#about">About</a>
				<a href="#stack">Stack</a>
				<a href="#projects">Projects</a>
				<a href="#contact">Contact Me</a>

				<!-- <a href="src/assets/" download="DuaByte-CV.pdf" class="cv-btn">Download CV</a> -->
			</div>
		</nav>

		<main>
			<!--start section hero -->
			<section id="hero">
				<div class="hero-bg"></div>
				<div class="hero-container">
					<div class="hero-text">
						<span class="status-pill">
							<span class="status-dot"></span>
							Learning & Building
						</span>

						<h1 class="name">Dua Budi Ramadhani</h1>
						<h2 class="tagline">Frontend Developer</h2>
						<p class="deskripsi">
							Building clean and responsive websites
							from scratch.
						</p>

						<div class="hero-buttons">
							<a
								href="#projects"
								class="btn btn-primary"
								>View Project</a
							>
							<a
								href="#contact"
								class="btn btn-outline"
								>Get In Touch</a
							>
						</div>

						<div class="social-links">
							<a
								href="https://github.com/duabyte"
								target="_blank"
								class="social-icon"
							>
								<i class="bi bi-github"></i>
							</a>
						</div>
					</div>
					<div class="hero-profile">
						<img
							src="src/assets/dua-pic.webp"
							alt="duabyte picture"
						/>
					</div>
				</div>
			</section>
			<!--end section hero -->

			<!--start section about -->
			<section id="about"></section>
			<!--end section about -->

			<!--start section stack -->
			<section id="stack"></section>
			<!--end section stack -->

			<!--start section projects -->
			<section id="projects"></section>
			<!--end section projects -->

			<!--start section contact -->
			<section id="contact"></section>
			<!--end section contact -->

		<script src="/src/main.js" defer></script>
